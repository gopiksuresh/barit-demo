<button type="button" class="hit" (click)="open.emit()" [attr.aria-label]="'View ' + item().name"></button>
<div class="photo">
  <bg-dish-image class="parallax" [src]="item().imageUrl" [name]="item().name" ratio="4 / 3" />
  <div class="fade" aria-hidden="true"></div>
  <span class="tag"><bg-icon name="star" [size]="12" [filled]="true" /> Chef’s special</span>
  <bg-veg-mark class="mark" [veg]="item().isVeg" />
</div>
<div class="body">
  <h3 class="name">{{ item().name }}</h3>
  @if (item().description) { <p class="desc">{{ item().description }}</p> }
  <div class="foot">
    <span class="price">
      @if (hasOptions()) { <span class="from">from</span> }{{ minPrice() | inr: 'short' }}
    </span>
    @if (canOrder()) {
      <bg-qty-stepper class="control" variant="round" [qty]="qty()" [itemName]="item().name"
                      [hasOptions]="hasOptions()" (increment)="add.emit()" (decrement)="remove.emit()" />
    }
  </div>
</div>
